# Shared by every njams-sdk-jms-namespace-tests child. The aggregator adds this directory to the children's
# testResources, so the configuration exists once instead of being copied into each module.
#
# These modules exist to show which JMS implementation the SDK selects on a given classpath. The packages that
# make and report that decision therefore log at DEBUG, while everything else stays quiet enough to read.

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS

# Both JMS trees, their factories and the shared AbstractJms* bases. slf4j-simple resolves a logger against the
# longest configured prefix, so this single entry also covers ...jms.javax, ...jms.factory and
# ...jms.javax.factory.
org.slf4j.simpleLogger.log.com.im.njams.sdk.communication.jms=debug

# Reflective JMS message access, used by both trees.
org.slf4j.simpleLogger.log.com.im.njams.sdk.utils.JmsMessageAccess=debug

# Not JMS packages, but the two classes that choose between the trees and report what was skipped. Without them
# the JMS output above shows which implementation ran, but not why it was the one picked.
org.slf4j.simpleLogger.log.com.im.njams.sdk.communication.CommunicationFactory=debug
org.slf4j.simpleLogger.log.com.im.njams.sdk.utils.ServiceLoaderSupport=debug
